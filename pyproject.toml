[project]
name = "flask-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "flask-sqlalchemy",
    "flask-migrate",
    "flask-wtf",
    "hatchling"
]

[project.optional-dependencies]
dev = ["ruff"]

[tool.hatch.envs.default.scripts]
run = "flask --app run:app run --debug"
init_db = "flask --app run:app db init"
migrate = "flask --app run:app db migrate"
upgrade = "flask --app run:app db upgrade"
shell = "flask --app run:app shell"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/config",
    "/run.py",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
